version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - model_store:/app/models
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "8080:8080"
    environment:
      - API_BASE=http://backend:8000
      - NICEGUI_PORT=8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model_store:
